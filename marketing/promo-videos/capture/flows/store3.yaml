appId: com.farabove.receiptvault
env:
  FRESHWAY_POINT: "17%,25%"
---
# Store 3 — Premium: every item read off a receipt, then itemised spreadsheet and the
# tax & expense report. State: reset.sh full premium [us]. record.sh passes Freshway's picker slot.
- waitForAnimationToEnd
- tapOn: ".*Scan Receipt"
- waitForAnimationToEnd
- tapOn: ".*Gallery"
- extendedWaitUntil:
    visible: "Collections"
    timeout: 10000
- runFlow:
    when:
      visible: "Private Access to Photos"
    commands:
      - tapOn: {point: "91%,18%"}
      - waitForAnimationToEnd
- tapOn: {point: "${FRESHWAY_POINT}"}     # receipt photo (record.sh passes its slot)
- extendedWaitUntil:
    visible: "FRESHWAY"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: s3_scanned
- swipe: {start: "50%,80%", end: "50%,40%", duration: 2500}
- waitForAnimationToEnd
- takeScreenshot: s3_items1
- swipe: {start: "50%,80%", end: "50%,40%", duration: 2500}
- waitForAnimationToEnd
- takeScreenshot: s3_items2
- tapOn: {point: "37%,94%"}            # Receipts
- waitForAnimationToEnd
- tapOn: {point: "72%,14%"}            # ↥ Export
- waitForAnimationToEnd
- tapOn: "This year"
- waitForAnimationToEnd
- tapOn: {point: "84%,46%"}            # Itemised breakdown
- waitForAnimationToEnd
- takeScreenshot: s3_export
- tapOn: "Export spreadsheet \\(XLSX\\)"
- extendedWaitUntil:
    visible: "Save to Files"
    timeout: 15000
- takeScreenshot: s3_xlsx_share
- tapOn: {point: "50%,20%"}             # dismiss share sheet
- waitForAnimationToEnd
- tapOn: "Tax & expense report \\(PDF\\)"
- extendedWaitUntil:
    visible: "Save to Files"
    timeout: 15000
- takeScreenshot: s3_pdf_share
