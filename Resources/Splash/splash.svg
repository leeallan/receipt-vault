<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- Receipt Vault splash mark: centred receipt glyph + mint verified badge.
       Rendered by MAUI Resizetizer (handles strokes/fills); shown on the
       #0D0D1A app background set via MauiSplashScreen Color in the csproj. -->
  <g transform="translate(512,512) scale(0.86) translate(-534,-479)">
    <!-- Receipt card (large), torn bottom -->
    <path d="M 294,150 L 666,150 Q 710,150 710,194 L 710,720
             L 671.67,760 L 633.33,720 L 595,760 L 556.67,720 L 518.33,760 L 480,720
             L 441.67,760 L 403.33,720 L 365,760 L 326.67,720 L 288.33,760 L 250,720
             L 250,194 Q 250,150 294,150 Z" fill="#FFFFFF"/>

    <!-- Merchant title + text lines -->
    <rect x="300" y="248" width="300" height="42" rx="21" fill="#B9B4FF"/>
    <rect x="300" y="332" width="210" height="28" rx="14" fill="#D3D0F2"/>
    <rect x="300" y="396" width="262" height="28" rx="14" fill="#D3D0F2"/>

    <!-- Divider -->
    <rect x="300" y="474" width="360" height="4" rx="2" fill="#ECEAF8"/>

    <!-- Total row: label + indigo amount highlight -->
    <rect x="300" y="512" width="132" height="30" rx="15" fill="#C7C2FF"/>
    <rect x="486" y="504" width="174" height="46" rx="12" fill="#6C63FF"/>

    <!-- Scan / verified badge -->
    <circle cx="700" cy="690" r="118" fill="#12D4A0"/>
    <path d="M 648,690 L 686,730 L 764,636" fill="none" stroke="#FFFFFF"
          stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
